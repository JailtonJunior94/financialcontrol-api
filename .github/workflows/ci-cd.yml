name: "FinancialControlAPI"

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  K8S_NAMESPACE: financialcontrol
  DOCKER_USERNAME: jailtonjunior

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout GithubActions
        uses: actions/checkout@v2

      - name: "Golang Linter"
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1

      - name: Build
        run: make build

      - name: "Unit Tests"
        run: make test

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Variable Substitution
        uses: microsoft/variable-substitution@v1
        with:
          files: ${{ github.workspace }}/configs/config.production.yaml
        env:
          mssql.connectionString: ${{ secrets.SQL_CONNECTION_STRING }}
          security.jwtSecret: ${{ secrets.JWT_SECRET }}

      - name: Docker Login
        uses: docker/login-action@v1.9.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push (Financial API)
        uses: docker/build-push-action@v2.4.0
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.DOCKER_USERNAME }}/financial_api:latest
            ${{ env.DOCKER_USERNAME }}/financial_api:v${{ github.run_number }}

  integration:
    runs-on: ubuntu-20.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: "Integration Tests (testcontainers)"
        run: go test -tags=integration -timeout=15m ./...

  pii-guardrail:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: "PII Guardrail — TestPIIRedactedEndToEnd (required)"
        run: go test -tags=integration -timeout=15m -run TestPIIRedactedEndToEnd ./internal/bootstrap/http/...

  deploy:
    needs: [build]
    runs-on: ubuntu-20.04
    environment:
      name: deploy
    steps:
      - name: Checkout GithubActions
        uses: actions/checkout@v2

      - name: Kubernetes set context
        uses: Azure/k8s-set-context@v1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.K8S_CONFIG }}

      - name: Deploy Namespace
        uses: Azure/k8s-deploy@v1.3
        with:
          manifests: |
            deployments/k8s/namespaces/financialcontrol.yaml

      - name: Deploy (Financial Control API)
        uses: Azure/k8s-deploy@v1.3
        with:
          namespace: ${{ env.K8S_NAMESPACE }}
          images: ${{ env.DOCKER_USERNAME }}/financial_api:v${{ github.run_number }}
          manifests: |
            deployments/k8s/deployments/financialapi-dp.yaml
            deployments/k8s/services/financialapi-svc.yaml
            deployments/k8s/certmanager/issuer.yaml
            deployments/k8s/ingress/ingress.yaml
